<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 24" role="img" aria-label="Đường nóc nhà (mái ngói) — họa tiết phân cách mục">
  <!-- Mai-nha roofline (§6.1 #4): the name itself ("nhà") licenses the
       family-home gable — abstract, one line, real negative space. -->
