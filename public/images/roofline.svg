    <line x1="52" y1="20" x2="88" y2="20" opacity="0.55" />
    <path d="M 88,20 L 120,5 L 152,20" />
    <line x1="152" y1="20" x2="188" y2="20" opacity="0.55" />
  </g>
</svg>
