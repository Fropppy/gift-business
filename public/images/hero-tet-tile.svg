<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img">
  <title>Hoa văn Tết liền mạch — sen, quất, hoa mai và mây</title>
  <rect width="600" height="800" fill="#FBEAE6"/>

  <!-- motif: cloud curl -->
  <g transform="translate(64 92)" fill="none" stroke="#C89B3C" stroke-width="1.8" stroke-linecap="round" opacity="0.4">
    <path d="M0 26 C 0 12, 12 2, 26 6 C 37 9, 41 21, 33 28 C 27 34, 16 31, 15 23 C 14.5 17, 20 13, 25 15.5"/>
    <path d="M40 30 C 46 20, 58 16, 68 22"/>
  </g>
  <g transform="translate(330 470)" fill="none" stroke="#C89B3C" stroke-width="1.8" stroke-linecap="round" opacity="0.38">
    <path d="M0 26 C 0 12, 12 2, 26 6 C 37 9, 41 21, 33 28 C 27 34, 16 31, 15 23 C 14.5 17, 20 13, 25 15.5"/>
    <path d="M40 30 C 46 20, 58 16, 68 22"/>
  </g>

  <!-- motif: blossom sprig -->
  <g transform="translate(430 140)">
    <path d="M0 60 C 14 38, 32 20, 56 8" fill="none" stroke="#961914" stroke-width="1.8" stroke-linecap="round" opacity="0.32"/>
    <g transform="translate(62 2)" fill="#B73927" fill-opacity="0.1" stroke="#B73927" stroke-width="1.4" opacity="0.4">
      <ellipse rx="5" ry="11" transform="rotate(0) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(72) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(144) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(216) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(288) translate(0 -11)"/>
    </g>
    <circle cx="62" cy="2" r="3.5" fill="#C89B3C" opacity="0.45"/>
  </g>
  <g transform="translate(90 540)">
    <path d="M0 60 C 14 38, 32 20, 56 8" fill="none" stroke="#961914" stroke-width="1.8" stroke-linecap="round" opacity="0.32"/>
    <g transform="translate(62 2)" fill="#B73927" fill-opacity="0.1" stroke="#B73927" stroke-width="1.4" opacity="0.4">
      <ellipse rx="5" ry="11" transform="rotate(0) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(72) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(144) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(216) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(288) translate(0 -11)"/>
    </g>
    <circle cx="62" cy="2" r="3.5" fill="#C89B3C" opacity="0.45"/>
  </g>

  <!-- motif: lotus buds -->
  <g transform="translate(150 300)" stroke="#961914" opacity="0.34" fill="none" stroke-linecap="round">
    <path d="M20 56 C 28 40, 28 24, 20 10 C 12 24, 12 40, 20 56 Z" stroke-width="1.6" fill="#B73927" fill-opacity="0.07"/>
    <path d="M44 56 C 50 44, 50 32, 44 22 C 38 32, 38 44, 44 56 Z" stroke-width="1.4" fill="#B73927" fill-opacity="0.05"/>
    <path d="M4 62 C 14 58, 30 58, 58 62" stroke-width="1.6"/>
  </g>
  <g transform="translate(330 680)" stroke="#961914" opacity="0.32" fill="none" stroke-linecap="round">
    <path d="M20 56 C 28 40, 28 24, 20 10 C 12 24, 12 40, 20 56 Z" stroke-width="1.6" fill="#B73927" fill-opacity="0.07"/>
    <path d="M44 56 C 50 44, 50 32, 44 22 C 38 32, 38 44, 44 56 Z" stroke-width="1.4" fill="#B73927" fill-opacity="0.05"/>
    <path d="M4 62 C 14 58, 30 58, 58 62" stroke-width="1.6"/>
  </g>

  <!-- motif: kumquat pair -->
  <g transform="translate(360 330)">
    <path d="M0 6 C 12 12, 24 18, 36 26" fill="none" stroke="#961914" stroke-width="1.6" stroke-linecap="round" opacity="0.3"/>
    <circle cx="14" cy="22" r="9" fill="#B73927" fill-opacity="0.08" stroke="#B73927" stroke-width="1.6" opacity="0.35"/>
    <circle cx="34" cy="30" r="7.5" fill="#B73927" fill-opacity="0.08" stroke="#B73927" stroke-width="1.4" opacity="0.35"/>
    <path d="M0 6 q 2 -10 12 -12 q 2 9 -12 12 Z" fill="#C89B3C" opacity="0.35"/>
  </g>
  <g transform="translate(90 700)">
    <path d="M0 6 C 12 12, 24 18, 36 26" fill="none" stroke="#961914" stroke-width="1.6" stroke-linecap="round" opacity="0.3"/>
    <circle cx="14" cy="22" r="9" fill="#B73927" fill-opacity="0.08" stroke="#B73927" stroke-width="1.6" opacity="0.35"/>
    <circle cx="34" cy="30" r="7.5" fill="#B73927" fill-opacity="0.08" stroke="#B73927" stroke-width="1.4" opacity="0.35"/>
    <path d="M0 6 q 2 -10 12 -12 q 2 9 -12 12 Z" fill="#C89B3C" opacity="0.35"/>
  </g>

  <!-- motif: dot triplet -->
  <g transform="translate(330 130)" fill="#C89B3C" opacity="0.4">
    <circle cx="0" cy="0" r="2.2"/>
    <circle cx="14" cy="-6" r="1.6"/>
    <circle cx="24" cy="4" r="1.8"/>
  </g>
  <g transform="translate(500 540)" fill="#C89B3C" opacity="0.38">
    <circle cx="0" cy="0" r="2.2"/>
    <circle cx="14" cy="-6" r="1.6"/>
    <circle cx="24" cy="4" r="1.8"/>
  </g>
  <g transform="translate(70 400)" fill="#B73927" opacity="0.3">
    <circle cx="0" cy="0" r="2"/>
    <circle cx="13" cy="6" r="1.5"/>
  </g>
  <g transform="translate(520 690)" fill="#C89B3C" opacity="0.35">
    <circle cx="0" cy="0" r="2"/>
    <circle cx="-12" cy="7" r="1.5"/>
  </g>

  <!-- edge-wrap motifs: kumquat crossing the right edge (duplicate enters from the left) -->
  <g transform="translate(566 240)">
    <path d="M0 6 C 12 12, 24 18, 36 26" fill="none" stroke="#961914" stroke-width="1.6" stroke-linecap="round" opacity="0.3"/>
    <circle cx="14" cy="22" r="9" fill="#B73927" fill-opacity="0.08" stroke="#B73927" stroke-width="1.6" opacity="0.35"/>
    <circle cx="34" cy="30" r="7.5" fill="#B73927" fill-opacity="0.08" stroke="#B73927" stroke-width="1.4" opacity="0.35"/>
    <path d="M0 6 q 2 -10 12 -12 q 2 9 -12 12 Z" fill="#C89B3C" opacity="0.35"/>
  </g>
  <g transform="translate(-34 240)">
    <path d="M0 6 C 12 12, 24 18, 36 26" fill="none" stroke="#961914" stroke-width="1.6" stroke-linecap="round" opacity="0.3"/>
    <circle cx="14" cy="22" r="9" fill="#B73927" fill-opacity="0.08" stroke="#B73927" stroke-width="1.6" opacity="0.35"/>
    <circle cx="34" cy="30" r="7.5" fill="#B73927" fill-opacity="0.08" stroke="#B73927" stroke-width="1.4" opacity="0.35"/>
    <path d="M0 6 q 2 -10 12 -12 q 2 9 -12 12 Z" fill="#C89B3C" opacity="0.35"/>
  </g>

  <!-- edge-wrap motifs: blossom crossing the bottom edge (duplicate enters from the top) -->
  <g transform="translate(300 812)">
    <path d="M0 60 C 14 38, 32 20, 56 8" fill="none" stroke="#961914" stroke-width="1.8" stroke-linecap="round" opacity="0.32"/>
    <g transform="translate(62 2)" fill="#B73927" fill-opacity="0.1" stroke="#B73927" stroke-width="1.4" opacity="0.4">
      <ellipse rx="5" ry="11" transform="rotate(0) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(72) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(144) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(216) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(288) translate(0 -11)"/>
    </g>
    <circle cx="62" cy="2" r="3.5" fill="#C89B3C" opacity="0.45"/>
  </g>
  <g transform="translate(300 12)">
    <path d="M0 60 C 14 38, 32 20, 56 8" fill="none" stroke="#961914" stroke-width="1.8" stroke-linecap="round" opacity="0.32"/>
    <g transform="translate(62 2)" fill="#B73927" fill-opacity="0.1" stroke="#B73927" stroke-width="1.4" opacity="0.4">
      <ellipse rx="5" ry="11" transform="rotate(0) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(72) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(144) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(216) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(288) translate(0 -11)"/>
    </g>
    <circle cx="62" cy="2" r="3.5" fill="#C89B3C" opacity="0.45"/>
  </g>
</svg>
