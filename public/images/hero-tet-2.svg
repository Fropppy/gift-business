<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
  <title>Hộp quà Tết thắt nơ và cành hoa mai — tranh botanica Nhà Mai</title>
  <defs>
    <radialGradient id="t2halo" cx="0.7" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#C89B3C" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#C89B3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#FBEAE6"/>
  <rect width="1200" height="800" fill="url(#t2halo)"/>

  <!-- table -->
  <rect x="0" y="600" width="1200" height="200" fill="#B73927" opacity="0.05"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#961914" stroke-width="2" opacity="0.3"/>

  <!-- confetti dots -->
  <circle cx="160" cy="120" r="6" fill="#C89B3C" opacity="0.5"/>
  <circle cx="240" cy="70" r="4" fill="#B73927" opacity="0.4"/>
  <circle cx="940" cy="100" r="5" fill="#961914" opacity="0.3"/>
  <circle cx="1060" cy="170" r="7" fill="#C89B3C" opacity="0.45"/>
  <circle cx="860" cy="220" r="4" fill="#B73927" opacity="0.35"/>
  <circle cx="130" cy="330" r="5" fill="#C89B3C" opacity="0.45"/>

  <!-- cloud scrollwork, top corners -->
  <g fill="none" stroke="#C89B3C" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M88 132 C 88 106, 110 90, 132 96 C 150 101, 156 120, 144 132 C 135 141, 120 138, 118 126 C 117 118, 124 112, 131 115"/>
    <path d="M156 134 C 164 118, 184 112, 198 122"/>
    <path d="M64 142 C 110 152, 168 152, 212 142"/>
    <path d="M1112 132 C 1112 106, 1090 90, 1068 96 C 1050 101, 1044 120, 1056 132 C 1065 141, 1080 138, 1082 126 C 1083 118, 1076 112, 1069 115"/>
    <path d="M1044 134 C 1036 118, 1016 112, 1002 122"/>
    <path d="M1136 142 C 1090 152, 1032 152, 988 142"/>
  </g>

  <!-- shadow -->
  <ellipse cx="620" cy="650" rx="300" ry="28" fill="#961914" opacity="0.08"/>

  <!-- back box, vermilion ribbon -->
  <g>
    <rect x="640" y="360" width="240" height="180" rx="14" fill="#FFFFFF" fill-opacity="0.4" stroke="#961914" stroke-width="2.2"/>
    <rect x="740" y="360" width="40" height="180" fill="#B73927" fill-opacity="0.12"/>
    <line x1="740" y1="360" x2="740" y2="540" stroke="#B73927" stroke-width="1.6" opacity="0.7"/>
    <line x1="780" y1="360" x2="780" y2="540" stroke="#B73927" stroke-width="1.6" opacity="0.7"/>
    <g transform="translate(760 356)">
      <path d="M0 0 C -38 -26, -64 -8, -46 12 C -32 24, -12 12, 0 0 Z" fill="#B73927" fill-opacity="0.15" stroke="#B73927" stroke-width="2"/>
      <path d="M0 0 C 38 -26, 64 -8, 46 12 C 32 24, 12 12, 0 0 Z" fill="#B73927" fill-opacity="0.15" stroke="#B73927" stroke-width="2"/>
      <circle r="7" fill="#FBEAE6" stroke="#B73927" stroke-width="2"/>
      <circle r="2.5" fill="#C89B3C"/>
    </g>
  </g>

  <!-- main box, gold ribbon -->
  <g>
    <rect x="330" y="330" width="330" height="230" rx="15" fill="#FFFFFF" fill-opacity="0.55" stroke="#961914" stroke-width="2.6"/>
    <rect x="310" y="284" width="370" height="78" rx="15" fill="#FFFFFF" fill-opacity="0.7" stroke="#961914" stroke-width="2.6"/>
    <line x1="316" y1="346" x2="674" y2="346" stroke="#C89B3C" stroke-width="2.4" opacity="0.9"/>
    <rect x="474" y="284" width="42" height="276" fill="#C89B3C" fill-opacity="0.14"/>
    <line x1="474" y1="284" x2="474" y2="560" stroke="#C89B3C" stroke-width="1.8" opacity="0.85"/>
    <line x1="516" y1="284" x2="516" y2="560" stroke="#C89B3C" stroke-width="1.8" opacity="0.85"/>
    <g transform="translate(495 290)">
      <path d="M0 2 C -46 -28, -78 -6, -55 16 C -38 30, -13 16, 0 2 Z" fill="#C89B3C" fill-opacity="0.18" stroke="#C89B3C" stroke-width="2.4"/>
      <path d="M0 2 C 46 -28, 78 -6, 55 16 C 38 30, 13 16, 0 2 Z" fill="#C89B3C" fill-opacity="0.18" stroke="#C89B3C" stroke-width="2.4"/>
      <path d="M-7 10 C -24 36, -40 46, -52 54" fill="none" stroke="#C89B3C" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 10 C 24 36, 40 46, 52 54" fill="none" stroke="#C89B3C" stroke-width="2" stroke-linecap="round"/>
      <circle r="10" fill="#FBEAE6" stroke="#C89B3C" stroke-width="2.4"/>
      <circle r="3.5" fill="#B73927"/>
    </g>
  </g>

  <!-- greeting card leaning on the boxes -->
  <g transform="rotate(-7 880 520)">
    <rect x="830" y="440" width="150" height="104" rx="10" fill="#FFFFFF" fill-opacity="0.6" stroke="#961914" stroke-width="2"/>
    <path d="M852 472 q 22 -12 44 0 t 44 0" fill="none" stroke="#B73927" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M852 494 q 22 -10 44 0 t 44 0" fill="none" stroke="#961914" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
    <path d="M852 514 q 14 -8 28 0 t 28 0" fill="none" stroke="#961914" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
    <circle cx="948" cy="528" r="15" fill="#C89B3C" fill-opacity="0.2" stroke="#C89B3C" stroke-width="1.6"/>
    <circle cx="948" cy="528" r="10" fill="none" stroke="#C89B3C" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- mai blossom sprig, left -->
  <g transform="translate(250 300)">
    <path d="M0 60 C 20 30, 40 10, 70 -6" fill="none" stroke="#961914" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
    <g transform="translate(70 -6)">
      <g fill="#B73927" fill-opacity="0.12" stroke="#B73927" stroke-width="1.6">
        <ellipse rx="6" ry="13" transform="rotate(0) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(72) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(144) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(216) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(288) translate(0 -13)"/>
      </g>
      <circle r="4.5" fill="#C89B3C"/>
    </g>
    <g transform="translate(30 32) scale(0.62)">
      <g fill="#B73927" fill-opacity="0.12" stroke="#B73927" stroke-width="1.6">
        <ellipse rx="6" ry="13" transform="rotate(0) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(72) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(144) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(216) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(288) translate(0 -13)"/>
      </g>
      <circle r="4.5" fill="#C89B3C"/>
    </g>
  </g>

  <!-- kumquat sprig resting by the table, bottom-right -->
  <g>
    <path d="M984 590 C 1000 576, 1022 568, 1046 568" fill="none" stroke="#961914" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="1010" cy="576" r="12" fill="#B73927" fill-opacity="0.12" stroke="#B73927" stroke-width="1.8"/>
    <circle cx="1050" cy="580" r="10" fill="#B73927" fill-opacity="0.12" stroke="#B73927" stroke-width="1.8"/>
    <path d="M1010 562 q 8 -9 18 -7 q -6 9 -18 7 Z" fill="#C89B3C" opacity="0.5"/>
  </g>
</svg>
