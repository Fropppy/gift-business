<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
  <title>Hộp quà doanh nghiệp gói nơ vàng, kèm thiệp và dấu sáp</title>
  <defs>
    <linearGradient id="h2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6EF"/>
      <stop offset="1" stop-color="#EFE4CE"/>
    </linearGradient>
    <radialGradient id="h2halo" cx="0.7" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#1E5C46" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1E5C46" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#h2bg)"/>
  <rect width="1200" height="800" fill="url(#h2halo)"/>

  <!-- table -->
  <rect x="0" y="600" width="1200" height="200" fill="#E7DCC8" opacity="0.65"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#D8CBB8" stroke-width="2"/>

  <!-- confetti dots -->
  <circle cx="160" cy="120" r="6" fill="#C89B3C" opacity="0.6"/>
  <circle cx="240" cy="70" r="4" fill="#C0272D" opacity="0.5"/>
  <circle cx="940" cy="100" r="5" fill="#1E5C46" opacity="0.45"/>
  <circle cx="1060" cy="170" r="7" fill="#C89B3C" opacity="0.5"/>
  <circle cx="860" cy="220" r="4" fill="#C96F2F" opacity="0.5"/>
  <circle cx="130" cy="330" r="5" fill="#C89B3C" opacity="0.5"/>

  <!-- shadow -->
  <ellipse cx="620" cy="650" rx="300" ry="30" fill="#2B2118" opacity="0.10"/>

  <!-- back box (cream, red ribbon) -->
  <g>
    <rect x="640" y="360" width="240" height="180" rx="14" fill="#FAF6EF" stroke="#E7DCC8" stroke-width="2.5"/>
    <rect x="626" y="330" width="268" height="58" rx="13" fill="#C0272D"/>
    <rect x="740" y="330" width="40" height="210" fill="#C0272D" opacity="0.92"/>
    <g transform="translate(760 332) scale(0.62)">
      <path d="M0 0 C -44 -28 -74 -6 -52 16 C -36 30 -12 14 0 0 Z" fill="#C0272D"/>
      <path d="M0 0 C 44 -28 74 -6 52 16 C 36 30 12 14 0 0 Z" fill="#C0272D"/>
      <circle r="11" fill="#C0272D" stroke="#FAF6EF" stroke-width="3"/>
    </g>
  </g>

  <!-- main box (white, pine lid, gold ribbon) -->
  <g>
    <rect x="330" y="330" width="330" height="230" rx="15" fill="#FFFFFF" stroke="#E7DCC8" stroke-width="3"/>
    <rect x="310" y="284" width="370" height="78" rx="15" fill="#1E5C46"/>
    <rect x="474" y="284" width="42" height="276" fill="#C89B3C"/>
    <!-- gold foil edge on lid -->
    <rect x="310" y="344" width="370" height="6" fill="#C89B3C" opacity="0.9"/>
  </g>
  <!-- satin bow, gold -->
  <g transform="translate(495 292)">
    <path d="M0 0 C -46 -30 -78 -6 -55 17 C -38 32 -13 15 0 0 Z" fill="#C89B3C"/>
    <path d="M0 0 C 46 -30 78 -6 55 17 C 38 32 13 15 0 0 Z" fill="#C89B3C"/>
    <path d="M-8 6 C -25 36 -42 46 -53 55 L -38 57 C -21 47 -6 27 4 10 Z" fill="#B0872F"/>
    <path d="M8 6 C 25 36 42 46 53 55 L 38 57 C 21 47 6 27 -4 10 Z" fill="#B0872F"/>
    <circle r="13" fill="#C89B3C" stroke="#FAF6EF" stroke-width="3"/>
  </g>

  <!-- greeting card leaning on the box -->
  <g transform="rotate(-7 880 520)">
    <rect x="830" y="440" width="150" height="104" rx="10" fill="#FFFFFF" stroke="#D8CBB8" stroke-width="2.5"/>
    <line x1="852" y1="470" x2="958" y2="470" stroke="#E7DCC8" stroke-width="6" stroke-linecap="round"/>
    <line x1="852" y1="492" x2="936" y2="492" stroke="#E7DCC8" stroke-width="6" stroke-linecap="round"/>
    <line x1="852" y1="514" x2="920" y2="514" stroke="#E7DCC8" stroke-width="6" stroke-linecap="round"/>
    <!-- wax seal on card -->
    <circle cx="948" cy="528" r="17" fill="#C0272D"/>
    <circle cx="948" cy="528" r="12" fill="none" stroke="#C89B3C" stroke-width="1.6" opacity="0.8"/>
  </g>

  <!-- mai sprig -->
  <g transform="translate(250 300)">
    <path d="M0 60 C 20 30, 40 10, 70 -6" stroke="#2B2118" stroke-width="3" fill="none" opacity="0.6"/>
    <g transform="translate(70 -6)">
      <g fill="#C89B3C">
        <ellipse rx="6" ry="13" transform="rotate(0) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(72) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(144) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(216) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(288) translate(0 -13)"/>
      </g>
      <circle r="5" fill="#C0272D"/>
    </g>
    <g transform="translate(30 32) scale(0.6)">
      <g fill="#C89B3C">
        <ellipse rx="6" ry="13" transform="rotate(0) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(72) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(144) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(216) translate(0 -13)"/>
        <ellipse rx="6" ry="13" transform="rotate(288) translate(0 -13)"/>
      </g>
      <circle r="5" fill="#C0272D"/>
    </g>
  </g>
</svg>
