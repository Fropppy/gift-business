<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Con dấu tròn Nhà Mai: hoa mai ở giữa, chữ NHÀ MAI · GIỎ QUÀ NHÀ MÌNH chạy quanh viền">
  <!-- Circular brand seal (§6.1 #3, stamp language): antique gold ink,
       pine mai blossom, postmark perforation. Matte ink register — never
       bright foil. Fixed palette: a stamp keeps its ink in every season. -->
  <defs>
    <path id="nm-seal-arc" d="M 60,60 m -45,0 a 45,45 0 1,1 90,0 a 45,45 0 1,1 -90,0" />
  </defs>

  <circle cx="60" cy="60" r="57.5" fill="none" stroke="#c89b3c" stroke-width="2.5" />
  <circle cx="60" cy="60" r="52" fill="none" stroke="#c89b3c" stroke-width="1" stroke-dasharray="2.5 4" />

  <text font-size="10" letter-spacing="2.2" fill="#c89b3c" font-weight="600"
        font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif">
    <textPath href="#nm-seal-arc" startOffset="2">NHÀ MAI · GIỎ QUÀ NHÀ MÌNH · GÓI TAY ·</textPath>
  </text>

  <!-- the namesake: single hoa mai blossom, pine ink — one motif per surface -->
  <g transform="translate(60 58)">
    <g fill="#1e5c46">
      <ellipse rx="5" ry="11" transform="rotate(0) translate(0 -11)" />
      <ellipse rx="5" ry="11" transform="rotate(72) translate(0 -11)" />
      <ellipse rx="5" ry="11" transform="rotate(144) translate(0 -11)" />
      <ellipse rx="5" ry="11" transform="rotate(216) translate(0 -11)" />
      <ellipse rx="5" ry="11" transform="rotate(288) translate(0 -11)" />
    </g>
    <circle r="5.5" fill="#c89b3c" />
  </g>

  <text x="60" y="92" text-anchor="middle" font-size="7.5" letter-spacing="2" fill="#1e5c46"
        font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-weight="600">GÓI ĐẸP MIỄN PHÍ</text>
</svg>
