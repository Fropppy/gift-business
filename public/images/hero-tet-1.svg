<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
  <title>Huy hiệu sen lõi xanh lam trên nền đêm Tết, mây và cành vàng bao quanh — tranh hero Nhà Mai</title>
  <defs>
    <!-- field glow: the halo is centred on the medallion so the jewel reads
         as the scene's single light source (mock A layering: gradient over
         flat field, strokes layered by opacity) -->
    <radialGradient id="t1halo" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#C89B3C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C89B3C" stop-opacity="0"/>
    </radialGradient>
    <!-- sapphire core: decor-only, alpha-modulated #1B3F8D, strictly inside
         the gold rings (validated table: 1.12:1 on field — never UI) -->
    <radialGradient id="t1jewel" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#1B3F8D" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#1B3F8D" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#1B3F8D" stop-opacity="0.72"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#10233F"/>
  <rect width="1200" height="800" fill="url(#t1halo)"/>

  <!-- four-point stars: SectionHead.astro:19 path geometry, never the glyph -->
  <g fill="#E8C96A">
    <path transform="translate(206 232) scale(0.55)" opacity="0.6" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/>
    <path transform="translate(972 300) scale(0.45)" opacity="0.5" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/>
    <path transform="translate(744 660) scale(0.3)" opacity="0.35" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/>
  </g>

  <!-- scattered dots (mock A, gold + porcelain) -->
  <circle cx="150" cy="140" r="6" fill="#C89B3C" opacity="0.95"/>
  <circle cx="230" cy="95" r="4" fill="#FFFDF5" opacity="0.7"/>
  <circle cx="955" cy="120" r="5" fill="#FFFDF5" opacity="0.65"/>
  <circle cx="1055" cy="205" r="7" fill="#C89B3C" opacity="0.9"/>
  <circle cx="125" cy="420" r="4" fill="#C89B3C" opacity="0.8"/>

  <!-- cloud scrollwork, top corners (shipped geometry, gold full strength) -->
  <g fill="none" stroke="#C89B3C" stroke-width="2.4" stroke-linecap="round" opacity="1">
    <path d="M88 132 C 88 106, 110 90, 132 96 C 150 101, 156 120, 144 132 C 135 141, 120 138, 118 126 C 117 118, 124 112, 131 115"/>
    <path d="M156 134 C 164 118, 184 112, 198 122"/>
    <path d="M64 142 C 110 152, 168 152, 212 142"/>
    <path d="M1112 132 C 1112 106, 1090 90, 1068 96 C 1050 101, 1044 120, 1056 132 C 1065 141, 1080 138, 1082 126 C 1083 118, 1076 112, 1069 115"/>
    <path d="M1044 134 C 1036 118, 1016 112, 1002 122"/>
    <path d="M1136 142 C 1090 152, 1032 152, 988 142"/>
  </g>
  <g fill="none" stroke="#FFFDF5" stroke-width="1.4" stroke-linecap="round" opacity="0.55">
    <path d="M88 138 C 88 112, 110 96, 132 102"/>
    <path d="M1112 138 C 1112 112, 1090 96, 1068 102"/>
  </g>

  <!-- side cloud curls at medallion height: fill the mid band, tie the
       medallion to the canvas sides -->
  <g fill="none" stroke="#C89B3C" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <g transform="translate(288 412)">
      <path d="M0 26 C 0 12, 12 2, 26 6 C 37 9, 41 21, 33 28 C 27 34, 16 31, 15 23 C 14.5 17, 20 13, 25 15.5"/>
      <path d="M40 30 C 46 20, 58 16, 68 22"/>
    </g>
    <g transform="translate(844 412)">
      <path d="M0 26 C 0 12, 12 2, 26 6 C 37 9, 41 21, 33 28 C 27 34, 16 31, 15 23 C 14.5 17, 20 13, 25 15.5"/>
      <path d="M40 30 C 46 20, 58 16, 68 22"/>
    </g>
  </g>

  <!-- table -->
  <rect x="0" y="612" width="1200" height="188" fill="#C89B3C" opacity="0.07"/>
  <line x1="0" y1="612" x2="1200" y2="612" stroke="#C89B3C" stroke-width="2" opacity="0.5"/>

  <!-- grounded lotus buds, resting on the table line, left -->
  <g transform="translate(96 531) scale(1.3)" stroke="#C89B3C" opacity="0.85" fill="none" stroke-linecap="round">
    <path d="M20 56 C 28 40, 28 24, 20 10 C 12 24, 12 40, 20 56 Z" stroke-width="1.6" fill="#C89B3C" fill-opacity="0.10"/>
    <path d="M44 56 C 50 44, 50 32, 44 22 C 38 32, 38 44, 44 56 Z" stroke-width="1.4" fill="#C89B3C" fill-opacity="0.07"/>
    <path d="M4 62 C 14 58, 30 58, 58 62" stroke-width="1.6"/>
  </g>
  <ellipse cx="136" cy="617" rx="44" ry="5" fill="#C89B3C" opacity="0.10"/>

  <!-- grounded kumquat sprig, resting on the table line, right -->
  <g fill="none" stroke="#C89B3C" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M1006 611 C 1022 592, 1044 580, 1068 578"/>
  </g>
  <circle cx="1032" cy="596" r="13" fill="#C89B3C" fill-opacity="0.14" stroke="#C89B3C" stroke-width="2.2"/>
  <circle cx="1072" cy="592" r="11" fill="#C89B3C" fill-opacity="0.10" stroke="#C89B3C" stroke-width="1.8" opacity="0.9"/>
  <path d="M1032 583 q 8 -10 19 -8 q -6 10 -19 8 Z" fill="#C89B3C" opacity="0.8"/>
  <ellipse cx="1050" cy="617" rx="46" ry="5" fill="#C89B3C" opacity="0.10"/>

  <!-- botanical hairline vines, rooted at the table line, drawn before the
       medallion so they flow BEHIND the rings (left stem ends under the
       jewel disc; no unanchored floats) -->
  <g fill="none" stroke="#C89B3C" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M428 611 C 400 546, 404 474, 450 424 C 488 382, 534 362, 566 352"/>
    <path d="M450 424 C 430 400, 424 372, 438 350 C 447 336, 462 332, 474 340"/>
    <path d="M772 611 C 800 546, 796 474, 750 424 C 712 382, 666 362, 634 352"/>
    <path d="M750 424 C 770 400, 776 372, 762 350 C 753 336, 738 332, 726 340"/>
  </g>
  <g fill="none" stroke="#E8C96A" stroke-width="1.2" stroke-linecap="round" opacity="0.4">
    <path d="M438 350 C 434 340, 434 330, 440 322"/>
    <path d="M762 350 C 766 340, 766 330, 760 322"/>
  </g>
  <!-- leaves on the vines (almond leaf, shipped-art shape) -->
  <g fill="#C89B3C" fill-opacity="0.14" stroke="#C89B3C" stroke-width="1.8" stroke-linejoin="round">
    <path d="M402 566 C 414 552, 432 546, 448 550 C 440 564, 422 570, 402 566 Z"/>
    <path d="M424 512 C 414 498, 412 480, 422 466 C 434 476, 438 496, 424 512 Z"/>
    <path d="M452 458 C 458 444, 470 434, 484 432 C 482 446, 470 456, 452 458 Z"/>
    <path d="M798 566 C 786 552, 768 546, 752 550 C 760 564, 778 570, 798 566 Z"/>
    <path d="M776 512 C 786 498, 788 480, 778 466 C 766 476, 762 496, 776 512 Z"/>
    <path d="M748 458 C 742 444, 730 434, 716 432 C 718 446, 730 456, 748 458 Z"/>
  </g>
  <!-- kumquat pair hanging from the left vine bend -->
  <path d="M468 430 C 474 448, 472 466, 462 480" fill="none" stroke="#C89B3C" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <circle cx="458" cy="492" r="13" fill="#C89B3C" fill-opacity="0.14" stroke="#C89B3C" stroke-width="2"/>
  <circle cx="478" cy="500" r="10" fill="#C89B3C" fill-opacity="0.10" stroke="#C89B3C" stroke-width="1.6" opacity="0.9"/>
  <path d="M458 479 q 8 -10 19 -8 q -6 10 -19 8 Z" fill="#C89B3C" opacity="0.8"/>
  <!-- lotus bud drooping from the right vine bend -->
  <path d="M732 430 C 726 448, 728 466, 738 480" fill="none" stroke="#C89B3C" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <g stroke="#C89B3C" fill="none" stroke-linejoin="round">
    <path d="M744 506 C 737 494, 737 478, 744 466 C 751 478, 751 494, 744 506 Z" stroke-width="1.8" fill="#C89B3C" fill-opacity="0.12"/>
  </g>
  <!-- blossom crowning the left curl tip, clear of the rings -->
  <g transform="translate(472 334)">
    <g fill="#C89B3C" fill-opacity="0.14" stroke="#C89B3C" stroke-width="1.6">
      <ellipse rx="5.5" ry="12" transform="rotate(0) translate(0 -12)"/>
      <ellipse rx="5.5" ry="12" transform="rotate(72) translate(0 -12)"/>
      <ellipse rx="5.5" ry="12" transform="rotate(144) translate(0 -12)"/>
      <ellipse rx="5.5" ry="12" transform="rotate(216) translate(0 -12)"/>
      <ellipse rx="5.5" ry="12" transform="rotate(288) translate(0 -12)"/>
    </g>
    <circle r="4" fill="#FFFDF5" opacity="0.85"/>
  </g>
  <!-- blossom crowning the right curl tip, clear of the rings -->
  <g transform="translate(728 334)">
    <g fill="none" stroke="#C89B3C" stroke-width="1.5" opacity="0.8">
      <ellipse rx="5" ry="11" transform="rotate(0) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(72) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(144) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(216) translate(0 -11)"/>
      <ellipse rx="5" ry="11" transform="rotate(288) translate(0 -11)"/>
    </g>
    <circle r="3.5" fill="#E8C96A" opacity="0.85"/>
  </g>

  <!-- central medallion: gold rings around the luminous sapphire jewel -->
  <g fill="none" stroke="#C89B3C" stroke-linecap="round">
    <circle cx="600" cy="372" r="150" stroke-width="1.2" opacity="0.5" stroke-dasharray="2 9"/>
    <circle cx="600" cy="372" r="122" stroke-width="3"/>
    <circle cx="600" cy="372" r="108" stroke-width="1.4" opacity="0.85"/>
  </g>
  <!-- gold hairline ring seating the jewel -->
  <circle cx="600" cy="372" r="92" fill="none" stroke="#E8C96A" stroke-width="1.6" opacity="0.95"/>
  <circle cx="600" cy="372" r="84" fill="url(#t1jewel)"/>
  <!-- porcelain glint + bright-gold spark: the jewel's light -->
  <ellipse cx="578" cy="344" rx="20" ry="10" transform="rotate(-24 578 344)" fill="#FFFEF1" opacity="0.28"/>
  <circle cx="575" cy="341" r="2.5" fill="#E8C96A" opacity="0.8"/>
  <!-- lotus glyph over the core, brightest hairline gold -->
  <g fill="none" stroke="#E8C96A" stroke-width="2" stroke-linejoin="round">
    <path d="M600 420 C 592 400, 592 376, 600 356 C 608 376, 608 400, 600 420 Z"/>
    <path d="M600 420 C 584 408, 571 391, 569 371 C 585 378, 594 398, 600 420 Z" opacity="0.9"/>
    <path d="M600 420 C 616 408, 629 391, 631 371 C 615 378, 606 398, 600 420 Z" opacity="0.9"/>
  </g>
  <path d="M578 427 L622 427" stroke="#E8C96A" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <g fill="#FFFDF5">
    <circle cx="600" cy="350" r="2.8"/>
    <circle cx="592" cy="358" r="1.8"/>
    <circle cx="608" cy="358" r="1.8"/>
  </g>
</svg>
