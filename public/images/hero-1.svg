<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
  <title>Giỏ trái cây cao cấp gói nơ terracotta</title>
  <defs>
    <linearGradient id="h1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6EF"/>
      <stop offset="1" stop-color="#F0E6D3"/>
    </linearGradient>
    <radialGradient id="h1halo" cx="0.72" cy="0.36" r="0.6">
      <stop offset="0" stop-color="#C89B3C" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#C89B3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#h1bg)"/>
  <rect width="1200" height="800" fill="url(#h1halo)"/>

  <!-- table -->
  <rect x="0" y="612" width="1200" height="188" fill="#E7DCC8" opacity="0.65"/>
  <line x1="0" y1="612" x2="1200" y2="612" stroke="#D8CBB8" stroke-width="2"/>

  <!-- scattered dots -->
  <circle cx="150" cy="140" r="6" fill="#C89B3C" opacity="0.55"/>
  <circle cx="220" cy="90" r="4" fill="#1E5C46" opacity="0.35"/>
  <circle cx="960" cy="120" r="5" fill="#C0272D" opacity="0.4"/>
  <circle cx="1050" cy="210" r="7" fill="#C89B3C" opacity="0.45"/>
  <circle cx="120" cy="420" r="4" fill="#C96F2F" opacity="0.4"/>

  <!-- shadow -->
  <ellipse cx="620" cy="640" rx="270" ry="30" fill="#2B2118" opacity="0.10"/>

  <!-- cellophane wrap -->
  <path d="M410 620 L470 210 Q620 170 770 210 L830 620 Z" fill="#FFFFFF" opacity="0.14"/>
  <path d="M470 210 Q620 170 770 210" stroke="#FFFFFF" stroke-width="5" opacity="0.35" fill="none"/>

  <!-- basket handle -->
  <path d="M468 470 C 510 300, 730 300, 772 470" stroke="#1E5C46" stroke-width="17" stroke-linecap="round" fill="none"/>

  <!-- fruits peeking above the rim -->
  <g>
    <path d="M508 448 q10 -14 24 0" stroke="#FFFFFF" stroke-width="0" fill="none"/>
    <ellipse cx="516" cy="394" rx="15" ry="7" fill="#1E5C46" transform="rotate(-22 516 394)"/>
    <circle cx="518" cy="428" r="46" fill="#C0272D"/>
    <path d="M500 406 q9 -12 20 0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55"/>

    <ellipse cx="596" cy="378" rx="15" ry="7" fill="#1E5C46" transform="rotate(-18 596 378)"/>
    <circle cx="598" cy="412" r="52" fill="#C89B3C"/>
    <path d="M578 390 q10 -13 22 0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55"/>

    <ellipse cx="690" cy="392" rx="15" ry="7" fill="#1E5C46" transform="rotate(-26 690 392)"/>
    <circle cx="692" cy="426" r="50" fill="#1E5C46"/>
    <path d="M672 404 q10 -12 21 0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- grape bunch -->
    <g>
      <circle cx="762" cy="420" r="16" fill="#1E5C46"/>
      <circle cx="788" cy="428" r="16" fill="#1E5C46"/>
      <circle cx="744" cy="446" r="16" fill="#1E5C46"/>
      <circle cx="772" cy="452" r="16" fill="#1E5C46"/>
      <circle cx="756" cy="474" r="15" fill="#1E5C46"/>
      <circle cx="760" cy="418" r="4" fill="#FAF6EF" opacity="0.5"/>
    </g>
    <circle cx="492" cy="470" r="26" fill="#C96F2F"/>
  </g>

  <!-- woven basket body -->
  <clipPath id="h1clip">
    <path d="M420 470 L820 470 L776 652 Q620 682 464 652 Z"/>
  </clipPath>
  <path d="M420 470 L820 470 L776 652 Q620 682 464 652 Z" fill="#1E5C46"/>
  <g clip-path="url(#h1clip)">
    <path d="M400 500 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#E7DCC8" stroke-width="9" fill="none" opacity="0.6"/>
    <path d="M400 546 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#E7DCC8" stroke-width="9" fill="none" opacity="0.6"/>
    <path d="M400 592 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#E7DCC8" stroke-width="9" fill="none" opacity="0.6"/>
    <path d="M400 634 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#E7DCC8" stroke-width="9" fill="none" opacity="0.5"/>
    <line x1="500" y1="470" x2="488" y2="668" stroke="#16473A" stroke-width="5" opacity="0.4"/>
    <line x1="620" y1="470" x2="620" y2="676" stroke="#16473A" stroke-width="5" opacity="0.4"/>
    <line x1="740" y1="470" x2="752" y2="668" stroke="#16473A" stroke-width="5" opacity="0.4"/>
  </g>
  <rect x="404" y="450" width="432" height="34" rx="17" fill="#16473A"/>

  <!-- satin bow -->
  <g transform="translate(620 620)">
    <path d="M0 0 C -44 -28 -74 -6 -52 16 C -36 30 -12 14 0 0 Z" fill="#C96F2F"/>
    <path d="M0 0 C 44 -28 74 -6 52 16 C 36 30 12 14 0 0 Z" fill="#C96F2F"/>
    <path d="M-8 6 C -24 34 -40 44 -50 52 L -36 54 C -20 44 -6 26 4 10 Z" fill="#B25D22"/>
    <path d="M8 6 C 24 34 40 44 50 52 L 36 54 C 20 44 6 26 -4 10 Z" fill="#B25D22"/>
    <circle r="12" fill="#C96F2F" stroke="#FAF6EF" stroke-width="3"/>
  </g>

  <!-- wax seal monogram -->
  <g transform="translate(946 566)">
    <circle r="48" fill="#C0272D"/>
    <circle r="48" fill="none" stroke="#C89B3C" stroke-width="3" opacity="0.85"/>
    <circle r="36" fill="none" stroke="#C89B3C" stroke-width="1.6" opacity="0.6"/>
    <text x="0" y="2" text-anchor="middle" dy="0.36em" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="2" fill="#FAF6EF">NM</text>
  </g>
</svg>
