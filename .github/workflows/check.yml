name: PR checks

# Deterministic gates for every pull request. The deploy workflow
# (deploy.yml) stays untouched: withastro/action@v6 does install + build +
# artifact upload in one step and cannot run custom scripts — and it
# triggers on push only.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Astro 7 requires >=22.12.0; never 23 (see deploy.yml)
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Docs gate (doc index, links, instruction-file integrity)
        run: npm run check:docs

      - name: Contrast gate (WCAG ratios, selector-level, per theme, rest + hover)
        run: node scripts/check-contrast.mjs

      - name: Build
        run: npm run build

      - name: Output gate (dist/ artifact assertions)
        run: node scripts/check-output.mjs

    # Appended AFTER steps: on purpose. Two docs-gate pins sit above this
    # point: check.yml:15 ('check:', assertion 17) and check.yml:23
    # ('actions/setup-node', assertion 18's CITED_FACTS, check-docs.mjs:561).
    # Living citations: ZCODE.md:139 and docs/architecture.md:88 cite
    # check.yml:15; ZCODE.md:143 cites check.yml:7-8. YAML job-mapping key
    # order is free; keys inserted above line 24 would move the pins and
    # fail the docs gate.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
